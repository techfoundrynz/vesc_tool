<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>VESC® Tool</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111318;
            color: #ececec;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0b0c10 0%, #1f2833 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #loading.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.15));
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #4facfe;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        #loading-text {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #8c9096;
            margin-top: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse-glow {
            0% {
                transform: scale(0.98);
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
            }

            50% {
                transform: scale(1.02);
                filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.25));
            }

            100% {
                transform: scale(0.98);
                filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
            }
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="logo-container">
            <img src="favicon.svg" alt="VESC Logo" />
        </div>
        <div class="spinner"></div>
        <div id="loading-text">Loading VESC Tool...</div>
    </div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <!-- App JavaScript bridges -->
    <script src="web_serial_bridge.js"></script>
    <script src="web_bluetooth_bridge.js"></script>
    <!-- Include esptool-js for browser-based flashing -->
    <script src="https://unpkg.com/esptool-js/bundle.js"></script>

    <script>
        // Stub for esptool integration
        window.webEspFlash = async (dataView, address) => {
            if (!window.esptooljs) {
                console.error("esptool-js not loaded");
                return;
            }
            if (!window.serialPort) {
                console.error("Web Serial not connected for ESP flashing");
                return;
            }
            try {
                const transport = new window.esptooljs.Transport(window.serialPort);
                const loader = new window.esptooljs.ESPLoader({
                    transport: transport,
                    baudrate: 460800,
                    terminal: {
                        writeLine: (str) => {
                            console.log("esptool:", str);
                            if (window.Module && window.Module._web_esp_state_update) {
                                const bytes = new TextEncoder().encode(str);
                                const ptr = window.Module._malloc(bytes.length + 1);
                                window.Module.HEAPU8.set(bytes, ptr);
                                window.Module.HEAPU8[ptr + bytes.length] = 0;
                                window.Module._web_esp_state_update(ptr);
                                window.Module._free(ptr);
                            }
                        }
                    }
                });

                await loader.main();
                await loader.flash_data(new Uint8Array(dataView.buffer), address, 0, 0, (fileIndex, written, total) => {
                    if (window.Module && window.Module._web_esp_flash_progress) {
                        window.Module._web_esp_flash_progress(written / total);
                    }
                });
                console.log("Flash completed");
            } catch (err) {
                console.error("Flash error:", err);
            }
        };

        var urlParams = new URLSearchParams(window.location.search);
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (urlParams.has('mobile')) {
            isMobile = urlParams.get('mobile') === 'true';
            console.log("UI mode overridden by query param mobile=" + urlParams.get('mobile'));
        }

        var appArgs = [];
        if (isMobile) {
            appArgs.push("--useMobileUi");
            console.log("Starting in Mobile VESC UI mode.");
        } else {
            console.log("Starting in full Desktop VESC Tool mode.");
        }

        var Module = {
            arguments: appArgs,
            preRun: [
                function () {
                    try { FS.mkdir('/home/web_user'); } catch (e) { }
                    FS.mount(IDBFS, {}, '/home/web_user');

                    Module.addRunDependency('syncfs');
                    FS.syncfs(true, function (err) {
                        if (err) console.error("IDBFS mount error:", err);
                        Module.removeRunDependency('syncfs');
                    });
                }
            ],
            postRun: [
                () => {
                    var loadingEl = document.getElementById("loading");
                    loadingEl.classList.add("fade-out");
                    setTimeout(() => { loadingEl.style.display = "none"; }, 600);

                    function flushSettings() {
                        FS.syncfs(false, function (err) {
                            if (err) console.log("IDBFS flush error:", err);
                        });
                    }
                    window.addEventListener('beforeunload', flushSettings);
                    window.addEventListener('pagehide', flushSettings);
                    setInterval(flushSettings, 3000);
                }
            ],
            print: (function () {
                return function (text) { console.log(text); };
            })(),
            printErr: function (text) { console.error(text); },
            canvas: (function () {
                var canvas = document.getElementById('canvas');
                return canvas;
            })(),
            setStatus: function (text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return;
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                var loadingTextEl = document.getElementById('loading-text');
                if (loadingTextEl) loadingTextEl.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        var script = document.createElement('script');
        script.src = "vesc_tool.js"; // This relies on the compile artifact name output by qmake
        document.body.appendChild(script);
    </script>
</body>

</html>
